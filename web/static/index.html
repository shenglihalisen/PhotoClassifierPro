<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoClassifierPro · 照片质量筛片</title>
<style>
  :root{
    --bg:#fbfbf9; --surface:#fff; --surface-2:#f5f5f2;
    --ink:#1b1b18; --ink-2:#4a4a44; --muted:#82827a;
    --line:#e7e7e2; --line-soft:#f0f0ec;
    --red:#c8372d; --amber:#a8620a; --blue:#1f5fbf; --green:#227a4b;
    --r-sm:8px; --r:12px; --r-lg:18px;
    --shadow-1:0 1px 2px rgba(27,27,24,.04);
    --shadow-2:0 2px 4px rgba(27,27,24,.04),0 8px 20px rgba(27,27,24,.05);
    --shadow-3:0 8px 16px rgba(27,27,24,.06),0 24px 48px rgba(27,27,24,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
  input{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .grow{flex:1}

  /* ── 顶栏 ── */
  header{
    position:sticky;top:0;z-index:30;height:56px;
    display:flex;align-items:center;gap:14px;padding:0 20px;
    background:rgba(251,251,249,.86);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
  .mark{width:22px;height:22px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
  .mark svg{width:12px;height:12px;display:block}
  .ver{font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0;margin-left:2px}

  .path{
    display:flex;align-items:center;height:34px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding-left:10px;transition:border-color .15s,box-shadow .15s;min-width:0;
  }
  .path:focus-within{border-color:#c9c9c1;box-shadow:0 0 0 3px rgba(27,27,24,.05)}
  .path svg{width:14px;height:14px;color:var(--muted);flex:none}
  .path input{
    border:none;outline:none;background:none;height:100%;
    padding:0 10px;width:min(32vw,400px);min-width:120px;
    font-size:13px;letter-spacing:.01em;
  }
  .path input::placeholder{color:#a5a59c}

  .btn{
    height:34px;padding:0 14px;border-radius:var(--r-sm);
    background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
    font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
    transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);color:var(--ink);border-color:#d8d8d1}
  .btn:active{transform:translateY(.5px)}
  .btn:disabled{opacity:.45;pointer-events:none}
  .btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.solid:hover{background:#000;border-color:#000;color:#fff}
  .btn.quiet{border-color:transparent;color:var(--muted)}
  .btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{height:30px;padding:0 11px;font-size:12.5px}

  /* ── 首屏 ── */
  main{max-width:1500px;margin:0 auto;padding:0 20px 72px}
  .hero{
    min-height:calc(100vh - 56px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:24px 0 6vh;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hero h1{
    margin:0 0 10px;font-size:clamp(26px,3.2vw,38px);line-height:1.2;
    font-weight:650;letter-spacing:-.025em;
  }
  .hero p{margin:0 0 34px;color:var(--muted);font-size:15px}

  .drop{
    max-width:620px;margin:0 auto;padding:36px 32px;
    background:var(--surface);border:1px dashed #d5d5cc;border-radius:var(--r-lg);
    transition:.2s;
  }
  .drop:hover{border-color:#bcbcb2;box-shadow:var(--shadow-2)}
  .drop .ico{width:38px;height:38px;margin:0 auto 14px;color:#b0b0a6}
  .drop .hint{color:var(--muted);font-size:13px;margin-bottom:16px}
  .drop form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .drop input{
    flex:1;min-width:250px;max-width:380px;height:38px;padding:0 12px;
    border:1px solid var(--line);border-radius:var(--r-sm);outline:none;background:var(--surface);
    font-size:13px;
  }
  .drop input:focus{border-color:#c9c9c1;box-shadow:0 0 0 3px rgba(27,27,24,.05)}
  .drop .btn{height:38px;padding:0 18px}

  .feats{
    display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;
    margin:30px auto 0;color:var(--muted);font-size:12.5px;
  }
  .feats span{display:inline-flex;align-items:center;gap:6px}
  .feats svg{width:13px;height:13px;color:#a3a39a}
  .detectors{margin:32px auto 0;max-width:760px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .detectors b{
    font-weight:500;font-size:12px;color:var(--ink-2);
    background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px;
  }

  /* ── 结果区 ── */
  .results{display:none;padding-top:18px}
  .results.on{display:block;animation:rise .3s ease both}

  .bar{
    display:flex;align-items:stretch;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);
    padding:14px 4px;margin-bottom:14px;box-shadow:var(--shadow-1);overflow:hidden;
  }
  .stat{flex:1;padding:0 18px;min-width:0}
  .stat + .stat{border-left:1px solid var(--line-soft)}
  .stat .k{color:var(--muted);font-size:11.5px;margin-bottom:3px;white-space:nowrap}
  .stat .v{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .stat.bad .v{color:var(--red)}
  .stat.warn .v{color:var(--amber)}
  .stat.ok .v{color:var(--green)}
  .stat .u{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
  .seg button{
    height:28px;padding:0 13px;border-radius:99px;font-size:12.5px;color:var(--muted);
    display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff}
  .seg .n{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
  .seg button.on .n{opacity:.75}

  .progress{height:3px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:12px;display:none}
  .progress.on{display:block}
  .progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}
  .status{color:var(--muted);font-size:12.5px;margin-bottom:16px;min-height:19px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;margin-top:1px}
  .status .dot.run{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* 网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:18px 16px}
  .ph{cursor:pointer;animation:rise .25s ease both}
  .ph .frame{
    position:relative;aspect-ratio:3/2;border-radius:var(--r);overflow:hidden;
    background:var(--surface-2);
    box-shadow:inset 0 0 0 1px rgba(27,27,24,.07),var(--shadow-1);
    transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s;
  }
  .ph:hover .frame{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(27,27,24,.09),var(--shadow-2)}
  .ph .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .flags{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px)}
  .fl{
    font-size:10.5px;line-height:1;padding:4px 7px;border-radius:5px;font-weight:500;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.14);white-space:nowrap;
  }
  .fl.red{color:var(--red)} .fl.amber{color:var(--amber)}
  .fl.blue{color:var(--blue)} .fl.green{color:var(--green)}
  .ph .cap{display:flex;align-items:center;gap:6px;margin-top:7px;padding:0 2px}
  .ph .nm{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:-.005em}
  .ph .sz{font-size:11px;color:#a5a59c;font-variant-numeric:tabular-nums;flex:none}
  .ph .dupmark{
    position:absolute;right:8px;top:8px;font-size:10.5px;color:#fff;font-weight:600;
    background:rgba(31,95,191,.92);padding:4px 7px;border-radius:5px;line-height:1;
  }

  .empty{text-align:center;color:var(--muted);padding:72px 20px;font-size:12.5px}
  .empty .ic{width:40px;height:40px;margin:0 auto 14px;color:#cdcdc4}
  .empty b{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px;font-weight:600}

  /* ── 预览 ── */
  .mask{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(16,16,14,.86);backdrop-filter:blur(14px);
    align-items:center;justify-content:center;padding:24px;
  }
  .mask.on{display:flex;animation:fade .18s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .viewer{
    width:min(1360px,96vw);height:min(880px,94vh);display:grid;
    grid-template-columns:1fr 360px;background:#141412;border-radius:var(--r-lg);
    overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5);position:relative;
  }
  .stage{
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.05), transparent 62%),#0e0e0d;
  }
  .stage img{max-width:none;max-height:none;transform-origin:center;user-select:none;-webkit-user-drag:none;cursor:grab}
  .stage img.drag{cursor:grabbing}
  .dirtbox{
    position:absolute;border:1.5px solid rgba(255,92,82,.95);border-radius:5px;
    background:rgba(255,92,82,.14);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.35);
  }
  .zoombar{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:2px;padding:4px;border-radius:11px;
    background:rgba(30,30,28,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);
  }
  .zoombar button{width:32px;height:30px;border-radius:7px;color:#e8e8e4;font-size:15px;
    display:grid;place-items:center;transition:.12s}
  .zoombar button:hover{background:rgba(255,255,255,.12)}
  .zoombar .pct{color:#cfcfc8;font-size:11.5px;display:grid;place-items:center;min-width:50px;
    font-variant-numeric:tabular-nums}
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:42px;height:42px;border-radius:50%;color:#fff;font-size:20px;
    display:grid;place-items:center;background:rgba(255,255,255,.08);
    transition:.15s;backdrop-filter:blur(6px);
  }
  .nav:hover{background:rgba(255,255,255,.18)}
  .nav.prev{left:16px} .nav.next{right:16px}
  .nav:disabled{opacity:.2;pointer-events:none}

  .side{
    background:var(--surface);border-left:1px solid rgba(0,0,0,.06);
    padding:22px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;
  }
  .side h3{margin:0 0 3px;font-size:13.5px;font-weight:600;line-height:1.35;word-break:break-all;letter-spacing:-.005em}
  .side .sub{color:var(--muted);font-size:11.5px;margin-bottom:18px;line-height:1.5;word-break:break-all}
  .side .lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;margin:18px 0 6px}
  .side .lbl:first-of-type{margin-top:0}

  .issue{display:flex;align-items:center;gap:9px;padding:9px 1px;font-size:13px;border-bottom:1px solid var(--line-soft)}
  .issue:last-child{border-bottom:none}
  .issue .sw{width:6px;height:6px;border-radius:2px;flex:none}
  .issue .nmx{flex:1;color:var(--ink)}
  .issue .val{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)} .kv .v{font-variant-numeric:tabular-nums;color:var(--ink-2)}

  .side .foot{
    margin-top:auto;padding-top:22px;border-top:1px solid var(--line-soft);
    display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;
    color:#a8a89f;font-size:11px;line-height:1.6;
  }
  .side .foot span{white-space:nowrap}
  .kbd{
    display:inline-block;min-width:15px;text-align:center;padding:0 4px;border-radius:3px;
    background:#f0f0ec;font-size:10px;font-family:ui-monospace,SFMono-Regular,monospace;
    color:#6a6a62;line-height:16px;margin-right:2px;
  }
  .close{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:16px;
    z-index:3;transition:.15s;backdrop-filter:blur(8px);
  }
  .close:hover{background:rgba(255,255,255,.22)}

  /* ── 阈值抽屉 ── */
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(424px,94vw);z-index:70;
    background:var(--surface);border-left:1px solid var(--line);
    box-shadow:-24px 0 60px rgba(27,27,24,.10);
    transform:translateX(101%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
    display:flex;flex-direction:column;
  }
  .drawer.on{transform:none}
  .drawer .hd{padding:18px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .drawer .hd .s{flex:1}
  .drawer .hd b{font-size:14px;font-weight:600}
  .drawer .hd .s{font-size:11.5px;color:var(--muted);font-weight:400}
  .drawer .bd{padding:18px 20px;overflow-y:auto;flex:1}
  .drawer .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px}

  .sl{margin-bottom:20px}
  .sl:last-child{margin-bottom:0}
  .sl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .sl .top b{font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .sl .top i{font-size:12px;font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;
    background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px;
    min-width:44px;text-align:center}
  .sl input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:16px;
    background:transparent;outline:none;margin:0;display:block;cursor:pointer;
  }
  .sl input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:99px;background:#e3e3dc;
  }
  .sl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);cursor:grab;margin-top:-5.5px;
    box-shadow:0 0 0 3px var(--surface),0 1px 3px rgba(0,0,0,.18);transition:box-shadow .15s;
  }
  .sl input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 4px rgba(27,27,24,.12),0 1px 3px rgba(0,0,0,.18)}
  .sl input[type=range]:active::-webkit-slider-thumb{cursor:grabbing}
  .sl .ends{display:flex;justify-content:space-between;color:#b8b8ae;font-size:10.5px;margin-top:4px}
  .sl .tip{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}

  .scrim{
    position:fixed;inset:0;background:rgba(27,27,24,.22);z-index:65;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .scrim.on{opacity:1;pointer-events:auto}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);
    background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;
    box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:.22s;z-index:90;
    max-width:80vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:880px){
    .viewer{grid-template-columns:1fr;grid-template-rows:1fr auto;height:94vh}
    .side{border-left:none;border-top:1px solid rgba(0,0,0,.06);max-height:40vh}
    .bar{flex-wrap:wrap;padding:12px 4px}
    .stat{flex:1 1 33%;padding:8px 12px}
    .stat:nth-child(4){border-left:none}
    header{padding:0 12px;gap:8px}
    .path input{width:110px}
    main{padding:0 12px 48px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15l4-4 3 3 5-6 4 5"/><rect x="3" y="4" width="18" height="16" rx="3"/>
      </svg>
    </span>
    PhotoClassifier<span class="ver" id="ver"></span>
  </div>
  <div class="grow"></div>
  <div class="path">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
    </svg>
    <input type="text" id="root" placeholder="照片文件夹路径，例如 D:\photos" spellcheck="false" autocomplete="off">
  </div>
  <button class="btn solid" id="scanBtn">开始扫描</button>
  <button class="btn" id="stopBtn" style="display:none">停止</button>
  <button class="btn quiet" id="thBtn" title="检测阈值">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 8h8M16 8h5M3 16h5M13 16h8"/>
      <circle cx="13.5" cy="8" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="10.5" cy="16" r="2.4" fill="currentColor" stroke="none"/>
    </svg>
  </button>
</header>

<main>
  <section class="hero" id="hero">
    <h1>把一整个相册倒进来</h1>
    <p>八项检测逐张过一遍，废片自己浮出来</p>

    <div class="drop">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16"/>
        <path d="M14 14l1.586-1.586a2 2 0 012.828 0L20 14"/>
        <rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9" r="1.6"/>
      </svg>
      <div class="hint">粘贴照片所在文件夹的完整路径</div>
      <form id="heroForm">
        <input type="text" id="root2" placeholder="C:\Users\me\Pictures" spellcheck="false" autocomplete="off">
        <button class="btn solid" type="submit">扫描这个文件夹</button>
      </form>
    </div>

    <div class="feats">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>单文件，零依赖</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>只读，不改不删</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>不联网、不上传</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>阈值可调</span>
    </div>

    <div class="detectors">
      <b>损坏</b><b>空镜</b><b>模糊</b><b>噪点</b><b>欠曝过曝</b><b>镜头脏污</b><b>重复</b><b>闭眼</b>
    </div>
  </section>

  <section class="results" id="results">
    <div class="progress" id="prog"><i id="progBar"></i></div>
    <div class="status" id="status"></div>

    <div class="bar">
      <div class="stat"><div class="k">扫描总数</div><div class="v num" id="cTotal">0<span class="u">张</span></div></div>
      <div class="stat bad"><div class="k">质量问题</div><div class="v num" id="cIssue">0<span class="u">张</span></div></div>
      <div class="stat warn"><div class="k">重复</div><div class="v num" id="cDup">0<span class="u">张</span></div></div>
      <div class="stat"><div class="k">损坏</div><div class="v num" id="cBad">0<span class="u">张</span></div></div>
      <div class="stat ok"><div class="k">正常</div><div class="v num" id="cOk">0<span class="u">张</span></div></div>
    </div>

    <div class="toolbar">
      <div class="seg" id="tabs">
        <button class="on" data-f="all">全部<span class="n" id="nAll">0</span></button>
        <button data-f="issue">问题<span class="n" id="nIssue">0</span></button>
        <button data-f="dup">重复<span class="n" id="nDup">0</span></button>
        <button data-f="ok">正常<span class="n" id="nOk">0</span></button>
      </div>
      <div class="grow"></div>
      <button class="btn sm quiet" id="csvBtn">导出 CSV</button>
      <button class="btn sm quiet" id="organizeBtn">归档废片…</button>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none"></div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="viewer">
    <div class="stage" id="stage">
      <img id="bigImg" alt="">
      <div id="dirtLayer"></div>
      <button class="close" id="closeBtn">✕</button>
      <button class="nav prev" id="prevBtn">‹</button>
      <button class="nav next" id="nextBtn">›</button>
      <div class="zoombar">
        <button id="zoomOut">−</button>
        <span class="pct" id="zoomPct">100%</span>
        <button id="zoomIn">＋</button>
        <button id="zoomFit" title="适应窗口">⤢</button>
      </div>
    </div>
    <aside class="side">
      <h3 id="pvName">—</h3>
      <div class="sub" id="pvSub"></div>
      <div class="lbl">检出</div>
      <div id="pvIssues"></div>
      <div class="lbl">指标</div>
      <div id="pvMetrics"></div>
      <div class="foot">
        <span><span class="kbd">←</span><span class="kbd">→</span>切换</span>
        <span><span class="kbd">+</span><span class="kbd">−</span>缩放</span>
        <span><span class="kbd">0</span>适应窗口</span>
        <span><span class="kbd">Esc</span>关闭</span>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="hd"><b>检测阈值</b><span class="s">改完重新扫描生效</span><div class="grow"></div><button class="btn sm quiet" id="thClose">关闭</button></div>
  <div class="bd" id="thBody"></div>
  <div class="ft">
    <button class="btn" id="thReset">恢复默认</button>
    <div class="grow"></div>
    <button class="btn solid" id="thSave">应用</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const state = { items: [], filter:'all', root:'', th:null, specs:null, cur:-1, zoom:1, panX:0, panY:0 };
let es = null;

const LABEL_COLOR = {
  '损坏':'red','模糊':'red','空镜':'amber','噪点':'amber','欠曝':'amber','过曝':'amber',
  '脏污':'amber','闭眼':'blue','重复':'blue'
};

const fmtSize = n => n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baseName = p => p.split(/[\\/]/).pop();

function toast(msg, ms=2600){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), ms);
}

async function boot(){
  try{ const j = await (await fetch('/api/version')).json(); $('#ver').textContent = j.version || ''; }catch(e){}
  await loadThresholds();
  const last = localStorage.getItem('pcp.lastRoot');
  if(last && !$('#root').value){ $('#root').value = last; $('#root2').value = last; }
}

async function loadThresholds(){
  try{
    const j = await (await fetch('/api/thresholds')).json();
    state.th = j.current; state.specs = j.specs; renderThresholds();
  }catch(e){}
}

const TH_LABELS = {
  blurLapStd:['模糊','拉普拉斯标准差低于此值判模糊','调大 → 更严'],
  noiseFloor:['噪点','平坦区噪声底线高于此值判噪点','调小 → 更严'],
  blankStd:['空镜','全局灰度标准差低于此值判空镜','调大 → 更严'],
  expUnder:['欠曝','平均亮度低于此值且死黑占比 >35% 判欠曝','调大 → 更严'],
  expOver:['过曝','平均亮度高于此值且死白占比 >80% 判过曝','调小 → 更严'],
  dupSim:['重复','相似度高于此值判重复（含像素二次确认）','调大 → 更严'],
  blinkEdge:['闭眼','眼部边缘密度低于此值判闭眼（双眼都低）','调大 → 更严']
};

function renderThresholds(){
  if(!state.th || !state.specs) return;
  const box = $('#thBody'); box.innerHTML = '';
  const ORDER = ['blurLapStd','noiseFloor','expUnder','expOver','blankStd','blinkEdge','dupSim'];
  const keys = ORDER.filter(k => state.specs[k]).concat(Object.keys(state.specs).filter(k => !ORDER.includes(k)));
  for(const k of keys){
    const spec = state.specs[k];
    const [name, tip, dir] = TH_LABELS[k] || [k,'',''];
    const el = document.createElement('div');
    el.className = 'sl';
    el.innerHTML =
      '<div class="top"><b>' + name + '</b><i id="v_' + k + '">' + state.th[k] + '</i></div>' +
      '<input type="range" min="' + spec.min + '" max="' + spec.max + '" step="' + spec.step + '" value="' + state.th[k] + '" data-k="' + k + '">' +
      '<div class="ends"><span>' + spec.min + '</span><span>' + spec.max + '</span></div>' +
      '<div class="tip">' + tip + ' · ' + dir + '</div>';
    box.appendChild(el);
  }
  box.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const k = e.target.dataset.k;
      state.th[k] = parseFloat(e.target.value);
      document.getElementById('v_' + k).textContent = e.target.value;
    });
  });
}

function beginScan(root){
  root = (root || '').trim();
  if(!root){ toast('先填一个照片文件夹路径'); $('#root').focus(); return; }
  if(es) es.close();

  state.root = root; state.items = []; state.filter = 'all'; state.finished = false;
  localStorage.setItem('pcp.lastRoot', root);
  $('#root').value = root; $('#root2').value = root;

  $('#hero').style.display = 'none';
  $('#results').classList.add('on');
  $('#grid').innerHTML = '';
  $('#empty').style.display = 'none';
  $('#scanBtn').disabled = true;
  $('#stopBtn').style.display = 'inline-flex';
  $('#prog').classList.add('on'); $('#progBar').style.width = '0%';
  setStatus('正在收集文件…', 'run');

  es = new EventSource('/api/scan?root=' + encodeURIComponent(root) + '&face=1');

  es.addEventListener('progress', ev=>{
    const p = JSON.parse(ev.data);
    const pct = p.total ? p.done * 100 / p.total : 0;
    $('#progBar').style.width = pct.toFixed(1) + '%';
    setStatus(p.done + ' / ' + p.total + ' · ' + p.current + (p.issues ? ' · 已发现 ' + p.issues + ' 个问题' : ''), 'run');
  });

  es.addEventListener('done', ev=>{
    const d = JSON.parse(ev.data);
    state.items = d.items || [];
    state.finished = true;
    $('#progBar').style.width = '100%';
    const s = d.summary;
    setStatus('扫描完成 · ' + s.total + ' 张 · 用时 ' + (s.elapsedMs/1000).toFixed(1) + 's', 'done');
    endScan();
    render();
  });

  es.addEventListener('failed', ev=>{
    let msg = '扫描中断';
    try{ msg = JSON.parse(ev.data).error || msg; }catch(e){}
    state.finished = true;
    setStatus(msg, 'err'); toast(msg); endScan();
  });

  // EventSource 的 error 既可能是真失败，也可能是我们自己 close() 之后的正常收尾，
  // 靠 finished 标志区分：已经拿到 done 的，这里一律忽略。
  es.onerror = ()=>{
    if(state.finished || !es) return;
    state.finished = true;
    setStatus('连接中断，请重试', 'err');
    endScan();
  };
}

function endScan(){
  if(es){ es.close(); es = null; }
  $('#scanBtn').disabled = false;
  $('#stopBtn').style.display = 'none';
  $('#prog').classList.remove('on');
}

function setStatus(text, kind){
  const color = kind === 'err' ? 'var(--red)' : kind === 'run' ? 'var(--amber)' : 'var(--green)';
  $('#status').innerHTML = '<span class="dot ' + (kind === 'run' ? 'run' : '') + '" style="background:' + color + '"></span>' + esc(text);
}

$('#scanBtn').onclick = ()=> beginScan($('#root').value);
$('#stopBtn').onclick = ()=>{ if(es){ es.close(); es = null; } endScan(); setStatus('已停止', 'done'); };
$('#root').addEventListener('keydown', e=>{ if(e.key === 'Enter') beginScan($('#root').value); });
$('#heroForm').addEventListener('submit', e=>{ e.preventDefault(); beginScan($('#root2').value); });

function flagsOf(it){
  const r = it.result || {}; const out = [];
  if(r.flags & 1) out.push('重复');
  if(r.flags & 2) out.push('损坏');
  if(r.flags & 4) out.push('空镜');
  if(r.flags & 8) out.push('脏污');
  if(r.flags & 16) out.push('模糊');
  if(r.flags & 32){
    if(r.exposure && r.exposure.under) out.push('欠曝');
    if(r.exposure && r.exposure.over) out.push('过曝');
  }
  if(r.flags & 64) out.push('噪点');
  if(r.flags & 128) out.push('闭眼');
  return out;
}

function render(){
  const items = state.items;
  const deco = items.map(it => {
    const labels = flagsOf(it);
    return { it, labels, isIssue: labels.some(l => l !== '重复') };
  });

  const issues = deco.filter(d => d.isIssue).length;
  const dups   = deco.filter(d => d.labels.includes('重复')).length;
  const bad    = deco.filter(d => d.labels.includes('损坏')).length;
  // 正常 = 没质量问题。重复只是冗余，不影响这张照片本身是好的。
  const ok     = items.length - issues;

  $('#cTotal').innerHTML = items.length + '<span class="u">张</span>';
  $('#cIssue').innerHTML = issues + '<span class="u">张</span>';
  $('#cDup').innerHTML   = dups + '<span class="u">张</span>';
  $('#cBad').innerHTML   = bad + '<span class="u">张</span>';
  $('#cOk').innerHTML    = ok + '<span class="u">张</span>';

  $('#nAll').textContent = items.length;
  $('#nIssue').textContent = issues;
  $('#nDup').textContent = dups;
  $('#nOk').textContent = ok;

  const f = state.filter;
  const shown = deco.filter(d =>
    f === 'issue' ? d.isIssue :
    f === 'dup'   ? d.labels.includes('重复') :
    f === 'ok'    ? !d.isIssue : true);

  const grid = $('#grid'); grid.innerHTML = '';
  if(!shown.length){
    $('#empty').style.display = 'block';
    $('#empty').innerHTML =
      '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 15l4.5-4.5a2 2 0 012.8 0L15 15"/><circle cx="9" cy="9" r="1.5"/>' +
      '</svg><b>没有符合条件的照片</b>换个筛选条件看看';
    return;
  }
  $('#empty').style.display = 'none';

  const frag = document.createDocumentFragment();
  for(const d of shown){
    const el = document.createElement('div');
    el.className = 'ph';
    const fl = d.labels.length
      ? d.labels.slice(0,3).map(l => '<span class="fl ' + (LABEL_COLOR[l]||'') + '">' + l + '</span>').join('')
      : '';
    el.innerHTML =
      '<div class="frame">' +
        '<img loading="lazy" src="/api/thumb?path=' + encodeURIComponent(d.it.path) + '&size=360" alt="">' +
        (fl ? '<div class="flags">' + fl + '</div>' : '') +
        (d.labels.includes('重复') && d.it.dupGroup ? '<span class="dupmark">组 ' + d.it.dupGroup + '</span>' : '') +
      '</div>' +
      '<div class="cap"><span class="nm" title="' + esc(d.it.rel) + '">' + esc(baseName(d.it.rel)) + '</span>' +
      '<span class="sz">' + fmtSize(d.it.size) + '</span></div>';
    el.onclick = ()=> openViewer(state.items.indexOf(d.it));
    frag.appendChild(el);
  }
  grid.appendChild(frag);
}

$('#tabs').addEventListener('click', e=>{
  const b = e.target.closest('button[data-f]'); if(!b) return;
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.filter = b.dataset.f; render();
});

$('#csvBtn').onclick = ()=> { window.location = '/api/export.csv'; };

$('#organizeBtn').onclick = async ()=>{
  if(!confirm('把废片按类型移动到「_待整理」文件夹？\n\n不会删除任何照片；同名文件自动加序号。')) return;
  const r = await fetch('/api/organize', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mode:'move'})});
  if(!r.ok){ toast('归档失败：' + await r.text()); return; }
  const j = await r.json();
  toast('已归档 ' + j.done + ' 个文件到 _待整理/');
  setStatus('归档完成 ' + j.done + '/' + j.total + ' · 重新扫描可查看结果', 'done');
};

function openViewer(idx){
  if(idx < 0) return;
  state.cur = idx;
  $('#mask').classList.add('on');
  showCurrent();
}
function closeViewer(){ $('#mask').classList.remove('on'); state.cur = -1; }

function showCurrent(){
  const it = state.items[state.cur]; if(!it) return;
  const r = it.result || {};
  $('#bigImg').src = '/api/full?path=' + encodeURIComponent(it.path);
  $('#pvName').textContent = baseName(it.rel);
  $('#pvSub').textContent = fmtSize(it.size) + ' · ' + (r.width||0) + ' × ' + (r.height||0);

  const labels = flagsOf(it);
  const dotColor = {
    'red':'var(--red)','amber':'var(--amber)','blue':'var(--blue)','green':'var(--green)'
  };
  $('#pvIssues').innerHTML = labels.length
    ? labels.map(l => {
        let v = '';
        if(l === '模糊') v = '拉普拉斯 ' + (r.lapStd||0).toFixed(1);
        if(l === '噪点') v = '噪声 ' + (r.noiseFloor||0).toFixed(1);
        if(l === '空镜') v = '标准差 ' + (r.grayStd||0).toFixed(1);
        if(l === '闭眼') v = r.blink ? (r.blink.closed + '/' + r.blink.faces) : '';
        if(l === '重复') v = it.dupGroup ? ('组 ' + it.dupGroup) : '';
        if(l === '欠曝') v = ((r.expClipLow||0)*100).toFixed(0) + '% 死黑';
        if(l === '过曝') v = ((r.expClipHigh||0)*100).toFixed(0) + '% 死白';
        return '<div class="issue"><span class="sw" style="background:' + (dotColor[LABEL_COLOR[l]] || 'var(--muted)') + '"></span>' +
               '<span class="nmx">' + l + '</span><span class="val">' + v + '</span></div>';
      }).join('')
    : '<div class="issue"><span class="sw" style="background:var(--green)"></span><span class="nmx">未发现质量问题</span></div>';

  const rows = [
    ['亮度均值', (r.expMean||0).toFixed(1)],
    ['死黑占比', ((r.expClipLow||0)*100).toFixed(1) + '%'],
    ['死白占比', ((r.expClipHigh||0)*100).toFixed(1) + '%'],
    ['拉普拉斯标准差', (r.lapStd||0).toFixed(2)],
    ['噪声底线', (r.noiseFloor||0).toFixed(2)]
  ];
  if(r.blink && r.blink.faces){
    rows.push(['人脸 / 闭眼', r.blink.faces + ' / ' + r.blink.closed]);
    rows.push(['眼部最小边缘密度', (r.blink.minEdge||0).toFixed(3)]);
  }
  $('#pvMetrics').innerHTML = rows.map(([k,v]) =>
    '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>').join('');

  const layer = $('#dirtLayer'); layer.innerHTML = '';
  if(r.lensDirt && r.lensDirt.boxes){
    r.lensDirt.boxes.forEach(b=>{
      const d = document.createElement('div');
      d.className = 'dirtbox';
      Object.assign(d.dataset, {x:b.x, y:b.y, w:b.w, h:b.h});
      layer.appendChild(d);
    });
  }
  $('#prevBtn').disabled = state.cur <= 0;
  $('#nextBtn').disabled = state.cur >= state.items.length - 1;
  resetZoom();
}

function resetZoom(){
  const img = $('#bigImg'), stage = $('#stage');
  const fit = Math.min(stage.clientWidth / (img.naturalWidth||1), stage.clientHeight / (img.naturalHeight||1), 1);
  state.zoom = fit || 1; state.panX = 0; state.panY = 0;
  applyTransform();
}
function applyTransform(){
  const img = $('#bigImg');
  img.style.transform = 'translate(' + state.panX + 'px,' + state.panY + 'px) scale(' + state.zoom + ')';
  $('#zoomPct').textContent = Math.round(state.zoom*100) + '%';
  const rect = img.getBoundingClientRect(), sr = $('#stage').getBoundingClientRect();
  document.querySelectorAll('.dirtbox').forEach(d=>{
    const x=+d.dataset.x, y=+d.dataset.y, w=+d.dataset.w, h=+d.dataset.h;
    d.style.left = (rect.left - sr.left + rect.width*x) + 'px';
    d.style.top = (rect.top - sr.top + rect.height*y) + 'px';
    d.style.width = (rect.width*w) + 'px';
    d.style.height = (rect.height*h) + 'px';
  });
}

$('#bigImg').addEventListener('load', resetZoom);
$('#zoomIn').onclick = ()=>{ state.zoom = Math.min(state.zoom*1.25, 8); applyTransform(); };
$('#zoomOut').onclick = ()=>{ state.zoom = Math.max(state.zoom/1.25, .05); applyTransform(); };
$('#zoomFit').onclick = resetZoom;
$('#prevBtn').onclick = ()=>{ if(state.cur > 0){ state.cur--; showCurrent(); } };
$('#nextBtn').onclick = ()=>{ if(state.cur < state.items.length-1){ state.cur++; showCurrent(); } };
$('#closeBtn').onclick = closeViewer;
$('#mask').onclick = e=>{ if(e.target.id === 'mask' || e.target.id === 'stage') closeViewer(); };

$('#stage').addEventListener('wheel', e=>{
  e.preventDefault();
  state.zoom = Math.min(Math.max(state.zoom * (e.deltaY < 0 ? 1.12 : 1/1.12), .05), 8);
  applyTransform();
}, {passive:false});

let drag = null;
$('#stage').addEventListener('mousedown', e=>{
  if(e.target.tagName !== 'IMG') return;
  drag = {x: e.clientX - state.panX, y: e.clientY - state.panY};
  $('#bigImg').classList.add('drag');
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  state.panX = e.clientX - drag.x; state.panY = e.clientY - drag.y;
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ drag = null; $('#bigImg').classList.remove('drag'); });

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if($('#mask').classList.contains('on')) closeViewer();
    else closeDrawer();
    return;
  }
  if(!$('#mask').classList.contains('on')) return;
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === '+' || e.key === '=') $('#zoomIn').click();
  if(e.key === '-') $('#zoomOut').click();
  if(e.key === '0') resetZoom();
});

const openDrawer = ()=>{ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); };
const closeDrawer = ()=>{ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); };
$('#thBtn').onclick = openDrawer;
$('#thClose').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;
$('#thReset').onclick = async ()=>{
  const j = await (await fetch('/api/thresholds')).json();
  state.th = j.default; renderThresholds();
};
$('#thSave').onclick = async ()=>{
  const r = await fetch('/api/thresholds', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state.th)});
  const j = await r.json();
  state.th = j.current;
  closeDrawer();
  toast('阈值已应用（版本 ' + j.version + '），重新扫描后生效');
};

boot();
// ?root=D:\photos 直接开扫：方便收藏常用目录，也方便自动化截图
(function(){
  const q = new URLSearchParams(location.search).get('root');
  if(q){ $('#root').value = q; $('#root2').value = q; setTimeout(()=>beginScan(q), 120); }
})();
</script>
</body>
</html>
